<div class="modal-overlay" role="presentation" (click)="onClose()"></div>
<div class="modal-content" role="dialog" aria-modal="true" [attr.aria-label]="'Dish details: ' + dish.name">
  <button class="close-button" type="button" aria-label="Close dish details" (click)="onClose()">×</button>

  <img class="dish-image" [src]="dish.imageUrl" [alt]="dish.name" />

  <h3 class="dish-name">{{ dish.name }}</h3>

  <div class="dish-info">
    <p class="dish-description">{{ dish.description }}</p>
    <p><strong>Calories:</strong> {{ dish.calories }}</p>
    <p><strong>Protein:</strong> {{ dish.proteins }}</p>
    <p><strong>Fats:</strong> {{ dish.fats }}</p>
    <p><strong>Carbohydrates:</strong> {{ dish.carbohydrates }}</p>
    <p><strong>Vitamins and minerals:</strong> {{ dish.vitamins }}</p>
  </div>

  <div class="price-weight">
    <span>{{ dish.price }}$</span>
    <span>{{ dish.weight }}</span>
  </div>
</div>
